# Bronnen diagnosticeren. Starten kan op twee manieren:
#  - handmatig: Actions → "Bronnen diagnose" → Run workflow (URL's en "bewaren" invullen);
#  - door .github/diagnose-request te pushen (bv. door Claude): één URL per regel, regels met # worden
#    overgeslagen, en een regel "bewaar" bewaart de volledige pagina's (voor het schrijven van een adapter).
# Schrijft diagnose.json (en bewaarde pagina's) naar de aparte branch "diagnose" (niet naar main).
name: Bronnen diagnose

on:
  push:
    branches: [main]
    paths: ['.github/diagnose-request']
  workflow_dispatch:
    inputs:
      urls:
        description: 'URL''s gescheiden door spaties (leeg = standaardlijst)'
        required: false
        default: ''
      save:
        description: 'Volledige pagina''s bewaren (1 = ja)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  diagnose:
    # Niet in de motor zelf (tomasr91/uit-core), wel in elke stadsrepo.
    if: github.repository != 'tomasr91/uit-core'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Opdracht lezen
        id: req
        env:
          URLS_INPUT: ${{ github.event.inputs.urls }}
          SAVE_INPUT: ${{ github.event.inputs.save }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            urls=$(grep -vE '^\s*(#|$)' .github/diagnose-request | grep -viE '^\s*bewaar\s*$' | tr '\n' ' ')
            if grep -qiE '^\s*bewaar\s*$' .github/diagnose-request; then save=1; else save=; fi
          else
            urls="$URLS_INPUT"; save="$SAVE_INPUT"
          fi
          echo "urls=$urls" >> "$GITHUB_OUTPUT"
          echo "save=$save" >> "$GITHUB_OUTPUT"
      - name: Diagnose
        env:
          COLLECTOR_CONTACT: ${{ vars.COLLECTOR_CONTACT }}
          DIAG_SAVE: ${{ steps.req.outputs.save }}
          URLS: ${{ steps.req.outputs.urls }}
        # Via een variabele, zodat tekens als & in een URL niet door de shell worden uitgevoerd.
        run: npx tsx collector/diagnose.ts $URLS > /tmp/diagnose.json; cat /tmp/diagnose.json
      - name: TLS en doorverwijzingen controleren
        env:
          URLS: ${{ steps.req.outputs.urls }}
        run: |
          # Hosts uit de opgegeven URL's, anders uit diagnoseUrls in city/sources.config.json.
          hosts=$(URLS="$URLS" node -e "const u=(process.env.URLS||'').split(/\\s+/).filter(Boolean);const l=u.length?u:(require('./city/sources.config.json').diagnoseUrls||[]);console.log([...new Set(l.map(x=>new URL(x).host))].join(' '))")
          bot=$(npx tsx -e "import('./city/config.ts').then((m) => console.log(m.CITY.bot.name))")
          for h in $hosts; do
            echo "=== $h" >> /tmp/tls.txt
            echo | timeout 20 openssl s_client -connect $h:443 -servername $h -showcerts 2>&1 | grep -E "^ *[0-9] s:|^ *i:|NotAfter|v:NotBefore|Verify return|verify error" >> /tmp/tls.txt || true
            curl -sS -o /dev/null -w "curl: %{http_code} %{url_effective} ip=%{remote_ip}\n" -L --max-time 20 -A "$bot/0.1" https://$h/ >> /tmp/tls.txt 2>&1 || true
            getent ahosts $h | head -3 >> /tmp/tls.txt || true
          done
          cat /tmp/tls.txt
      - name: Naar branch diagnose
        run: |
          git config user.name "agenda-bot"
          git config user.email "agenda-bot@users.noreply.github.com"
          git checkout --orphan diagnose
          git rm -rq --cached .
          cp /tmp/diagnose.json diagnose.json; cp /tmp/tls.txt tls.txt; cp /tmp/diag-* . 2>/dev/null || true
          git add diagnose.json tls.txt diag-* 2>/dev/null || git add diagnose.json tls.txt
          git commit -qm "Diagnose $(date -u +%Y-%m-%dT%H:%M)"
          git push -f origin diagnose
