# Bronnen diagnosticeren: handmatig starten via Actions → "Bronnen diagnose" → Run workflow.
# Schrijft diagnose.json naar de aparte branch "diagnose" (niet naar main).
name: Bronnen diagnose

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'URL''s gescheiden door spaties (leeg = standaardlijst)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Diagnose
        env:
          COLLECTOR_CONTACT: ${{ vars.COLLECTOR_CONTACT }}
        run: npx tsx collector/diagnose.ts ${{ github.event.inputs.urls }} > /tmp/diagnose.json; cat /tmp/diagnose.json
      - name: TLS en doorverwijzingen controleren
        run: |
          for h in www.uitagendautrecht.nl www.kasteeldehaar.nl www.jaarbeurs.nl jaarbeurs.nl; do
            echo "=== $h" >> /tmp/tls.txt
            echo | timeout 20 openssl s_client -connect $h:443 -servername $h -showcerts 2>&1 | grep -E "^ *[0-9] s:|^ *i:|NotAfter|v:NotBefore|Verify return|verify error" >> /tmp/tls.txt || true
            curl -sS -o /dev/null -w "curl: %{http_code} %{url_effective} ip=%{remote_ip}\n" -L --max-time 20 -A "UtrechtFamilyAgendaBot/0.1" https://$h/ >> /tmp/tls.txt 2>&1 || true
            getent ahosts $h | head -3 >> /tmp/tls.txt || true
          done
          cat /tmp/tls.txt
      - name: Naar branch diagnose
        run: |
          git config user.name "agenda-bot"
          git config user.email "agenda-bot@users.noreply.github.com"
          git checkout --orphan diagnose
          git rm -rq --cached .
          cp /tmp/diagnose.json diagnose.json; cp /tmp/tls.txt tls.txt
          git add diagnose.json tls.txt
          git commit -qm "Diagnose $(date -u +%Y-%m-%dT%H:%M)"
          git push -f origin diagnose
